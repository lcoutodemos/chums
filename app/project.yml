name: Chums
# Bundle IDs come from $CHUMS_BUNDLE and the team from $CHUMS_TEAM (bin/chums-install and bin/chums-sim set them): an
# ID belongs to the team that first registered it, so signing with another team needs another ID.
options:
  bundleIdPrefix: dev.chums
  deploymentTarget:
    iOS: "26.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "${CHUMS_TEAM}"
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_PREVIEWS: "YES"
targets:
  Chums:
    type: application
    platform: iOS
    sources:
      - ChumsPhone
      - ChumsPhoneShared
      # the watch's engine, shared: the characters, the hub, talking, the conversation (watch-only parts are #if'd)
      - path: ChumsWatch
        includes: [Rig/*.swift, Screen.swift, HubClient.swift, HubConfig.swift, Voice.swift, Controller.swift, Chat.swift,
                   Artifacts.swift, Alerts.swift, Agents.swift, AgentFace.swift, Soul.swift, StayOn.swift, Compatibility.swift]
      - path: ChumsWatch/Noodle
        type: folder
        buildPhase: resources
      # Noodle's shapes: the tube's poses and the moves between them (without it, every pose is a crumpled ball)
      - path: ChumsWatch/noodle-shapes.bin
        buildPhase: resources
      - Shared/Characters.xcassets
    info:
      path: ChumsPhone/Info.plist
      properties:
        CFBundleDisplayName: Chums
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSMicrophoneUsageDescription: Listens only while you hold the microphone (or after you open Chums to talk).
        NSCameraUsageDescription: Takes a photo to send to an agent, when you choose Take Photo.
        CFBundleURLTypes:
          - CFBundleURLName: chums
            CFBundleURLSchemes: [chums]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${CHUMS_BUNDLE}
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: [ChumsPhoneUITests]
    dependencies:
      # the Home Screen and Lock Screen widgets and the Talk control
      - target: ChumsPhoneWidgets
        embed: true
      # The watch app ships inside the phone app, in its Watch folder.
      - target: ChumsWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
  ChumsWatch:
    type: application
    platform: watchOS
    sources:
      - path: ChumsWatch
        excludes: [Noodle]
      # Noodle's clips: one HEIC image sequence per clip (tools/noodle-watch.sh) and their per-frame data
      - path: ChumsWatch/Noodle
        type: folder
        buildPhase: resources
      # the characters' faces, shared with the iPhone app and its widgets
      - Shared/Characters.xcassets
    info:
      path: ChumsWatch/Info.plist
      properties:
        CFBundleDisplayName: Chums
        WKApplication: true
        # a standalone watch app: it asks for Health access on the watch (a dependent one asks through the iPhone app)
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: ${CHUMS_BUNDLE}
        NSMicrophoneUsageDescription: Listens only while you hold the screen.
        NSHealthShareUsageDescription: Runs a workout session only to stay on screen, like a keyring pet. It never saves a workout.
        NSHealthUpdateUsageDescription: Runs a workout session only to stay on screen, like a keyring pet. It never saves a workout.
        # workout-processing keeps Chums running; Apple requires audio too for a workout app that taps your wrist
        WKBackgroundModes: [workout-processing, audio]
        NSLocalNetworkUsageDescription: Talks to the hub running on your Mac.
        # plain HTTP only for the Simulator's 127.0.0.1; a real watch uses the Funnel HTTPS address
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${CHUMS_BUNDLE}.watchkitapp
        # HealthKit, only to run a workout session that keeps Chums on screen (keyring mode); nothing is saved
        CODE_SIGN_ENTITLEMENTS: ChumsWatch/ChumsWatch.entitlements
        TARGETED_DEVICE_FAMILY: "4"
    dependencies:
      # the complication / Smart Stack widget that opens Chums
      - target: ChumsWidget
  ChumsWidget:
    type: app-extension
    platform: watchOS
    sources: [ChumsWidget]
    info:
      path: ChumsWidget/Info.plist
      properties:
        CFBundleDisplayName: Chums
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${CHUMS_BUNDLE}.watchkitapp.widget
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
  ChumsPhoneWidgets:
    type: app-extension
    platform: iOS
    sources:
      - ChumsPhoneWidgets
      - ChumsPhoneShared
      - path: ChumsWatch/HubConfig.swift
      # the watch's characters, to draw its screen in the widgets (WatchScreen)
      - path: ChumsWatch
        includes: [Rig/*.swift, AgentFace.swift]
      - path: ChumsWatch/Noodle
        type: folder
        buildPhase: resources
      - path: ChumsWatch/noodle-shapes.bin
        buildPhase: resources
      - Shared/Characters.xcassets
    info:
      path: ChumsPhoneWidgets/Info.plist
      properties:
        CFBundleDisplayName: Chums
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${CHUMS_BUNDLE}.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  # the iPhone app driven by real touches in the Simulator (ChumsPhoneUITests.swift says how to run it)
  ChumsPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ChumsPhoneUITests]
    dependencies:
      - target: Chums
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${CHUMS_BUNDLE}.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Chums
        TARGETED_DEVICE_FAMILY: "1"
